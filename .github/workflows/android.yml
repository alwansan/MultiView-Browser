name: Android APK
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          ls -ld /usr/local/lib/android/sdk/cmdline-tools
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify preinstalled SDK 35
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          echo "Android SDK 35 preinstalled and ready"
      - name: Test adaptive grid planning
        run: |
          mkdir -p build/grid-test-classes
          javac -d build/grid-test-classes app/src/main/java/com/alwansan/multiview/GridSizing.java scripts/GridSizingTest.java
          java -cp build/grid-test-classes com.alwansan.multiview.GridSizingTest
      - name: Test zoom and web appearance rules
        run: |
          mkdir -p build/appearance-test-classes
          javac -d build/appearance-test-classes app/src/main/java/com/alwansan/multiview/WebAppearance.java scripts/WebAppearanceTest.java
          java -cp build/appearance-test-classes com.alwansan.multiview.WebAppearanceTest
      - name: Test selective cold-session restoration
        run: |
          mkdir -p build/restore-test-classes
          javac -d build/restore-test-classes app/src/main/java/com/alwansan/multiview/SessionRestorePlan.java scripts/SessionRestorePlanTest.java
          java -cp build/restore-test-classes com.alwansan.multiview.SessionRestorePlanTest
      - name: Validate brand assets and bilingual documentation
        run: python3 scripts/brand_audit.py
      - name: Source checks
        run: python3 scripts/source_audit.py
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Use stable APK signing when owner's secrets exist
        if: github.event_name != 'pull_request'
        env:
          MV_KEYSTORE_B64: ${{ secrets.MULTIVIEW_KEYSTORE_B64 }}
          MV_STORE_PASS: ${{ secrets.MULTIVIEW_STORE_PASS }}
          MV_KEY_PASS: ${{ secrets.MULTIVIEW_KEY_PASS }}
          MV_KEY_ALIAS: ${{ secrets.MULTIVIEW_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "${MV_KEYSTORE_B64:-}" && -z "${MV_STORE_PASS:-}" && -z "${MV_KEY_PASS:-}" && -z "${MV_KEY_ALIAS:-}" ]]; then
            echo "Stable signing not configured; using ephemeral debug signature."
          else
            test -n "${MV_KEYSTORE_B64:-}"
            test -n "${MV_STORE_PASS:-}"
            test -n "${MV_KEY_PASS:-}"
            test -n "${MV_KEY_ALIAS:-}"
            ks="$RUNNER_TEMP/multiview-signing.p12"
            target="$RUNNER_TEMP/multiview-signed.apk"
            trap 'rm -f "$ks" "$target"' EXIT
            printf '%s' "$MV_KEYSTORE_B64" | base64 --decode > "$ks"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "$ks" \
              --ks-pass env:MV_STORE_PASS \
              --ks-key-alias "$MV_KEY_ALIAS" \
              --key-pass env:MV_KEY_PASS \
              --out "$target" app/build/outputs/apk/debug/app-debug.apk
            mv "$target" app/build/outputs/apk/debug/app-debug.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
              app/build/outputs/apk/debug/app-debug.apk
            echo "APK signed using owner's stable private GitHub secrets."
          fi
      - name: Print SHA256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: multiview-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned experimental APK on GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          version="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          test -n "$version"
          tag="v$version"
          sha256sum "$apk" | sed 's#app/build/outputs/apk/debug/##' > SHA256SUMS.txt
          cat > release-notes.md <<EOF
          # MultiView Browser $version

          **English:** Experimental Android preview built from commit \`$GITHUB_SHA\`. Includes the bilingual (English/Arabic) project pages, adaptive app icon, multipane browsing, session recovery and selective privacy cleanup.

          **العربية:** إصدار تجريبي لأندرويد من المصدر \`$GITHUB_SHA\`. يتضمن صفحتي المشروع العربية والإنجليزية، أيقونة جديدة، تصفح صفحات متعددة، تحسين استعادة الجلسة وتنظيفاً اختيارياً.

          - Download: \`app-debug.apk\`
          - Integrity: \`SHA256SUMS.txt\`
          - This is a **debug-signed experimental APK**, unless repository signing secrets are configured.
          - Android can still terminate background WebViews; no promise of indefinite page retention.
          - Real-device validation is separate from successful CI builds.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file release-notes.md
            gh release upload "$tag" "$apk" SHA256SUMS.txt --clobber
          else
            gh release create "$tag" "$apk" SHA256SUMS.txt \
              --title "MultiView Browser $version | متصفح العرض المتعدد" \
              --notes-file release-notes.md --prerelease --target "$GITHUB_SHA"
          fi
          echo "Versioned release published: $tag"

      - name: Update rolling preview download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view preview-latest >/dev/null 2>&1; then
            gh release create preview-latest --title "MultiView Browser · rolling preview" --notes "Rolling experimental APK, automatically replaced by successful main builds. See versioned releases for source-commit provenance." --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload preview-latest app/build/outputs/apk/debug/app-debug.apk SHA256SUMS.txt --clobber
