name: Android APK
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          ls -ld /usr/local/lib/android/sdk/cmdline-tools
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify preinstalled SDK 35
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          echo "Android SDK 35 preinstalled and ready"
      - name: Test adaptive grid planning
        run: |
          mkdir -p build/grid-test-classes
          javac -d build/grid-test-classes app/src/main/java/com/alwansan/multiview/GridSizing.java scripts/GridSizingTest.java
          java -cp build/grid-test-classes com.alwansan.multiview.GridSizingTest
      - name: Test zoom and web appearance rules
        run: |
          mkdir -p build/appearance-test-classes
          javac -d build/appearance-test-classes app/src/main/java/com/alwansan/multiview/WebAppearance.java scripts/WebAppearanceTest.java
          java -cp build/appearance-test-classes com.alwansan.multiview.WebAppearanceTest
      - name: Test selective cold-session restoration
        run: |
          mkdir -p build/restore-test-classes
          javac -d build/restore-test-classes app/src/main/java/com/alwansan/multiview/SessionRestorePlan.java scripts/SessionRestorePlanTest.java
          java -cp build/restore-test-classes com.alwansan.multiview.SessionRestorePlanTest
      - name: Source checks
        run: python3 scripts/source_audit.py
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Use stable APK signing when owner's secrets exist
        if: github.event_name != 'pull_request'
        env:
          MV_KEYSTORE_B64: ${{ secrets.MULTIVIEW_KEYSTORE_B64 }}
          MV_STORE_PASS: ${{ secrets.MULTIVIEW_STORE_PASS }}
          MV_KEY_PASS: ${{ secrets.MULTIVIEW_KEY_PASS }}
          MV_KEY_ALIAS: ${{ secrets.MULTIVIEW_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "${MV_KEYSTORE_B64:-}" && -z "${MV_STORE_PASS:-}" && -z "${MV_KEY_PASS:-}" && -z "${MV_KEY_ALIAS:-}" ]]; then
            echo "Stable signing not configured; using ephemeral debug signature."
          else
            test -n "${MV_KEYSTORE_B64:-}"
            test -n "${MV_STORE_PASS:-}"
            test -n "${MV_KEY_PASS:-}"
            test -n "${MV_KEY_ALIAS:-}"
            ks="$RUNNER_TEMP/multiview-signing.p12"
            target="$RUNNER_TEMP/multiview-signed.apk"
            trap 'rm -f "$ks" "$target"' EXIT
            printf '%s' "$MV_KEYSTORE_B64" | base64 --decode > "$ks"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "$ks" \
              --ks-pass env:MV_STORE_PASS \
              --ks-key-alias "$MV_KEY_ALIAS" \
              --key-pass env:MV_KEY_PASS \
              --out "$target" app/build/outputs/apk/debug/app-debug.apk
            mv "$target" app/build/outputs/apk/debug/app-debug.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
              app/build/outputs/apk/debug/app-debug.apk
            echo "APK signed using owner's stable private GitHub secrets."
          fi
      - name: Print SHA256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: multiview-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling experimental APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view preview-latest >/dev/null 2>&1; then
            gh release create preview-latest --title "MultiView Browser · experimental preview" --notes "Automated build of the latest main. Development-only, not device-validated. Download app-debug.apk below." --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload preview-latest app/build/outputs/apk/debug/app-debug.apk --clobber
