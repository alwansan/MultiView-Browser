plugins {
    id 'com.android.application'
}
android {
    namespace 'com.alwansan.multiview'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alwansan.multiview'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.2.1-preview'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
